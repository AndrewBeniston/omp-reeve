name: Publish desktop app

# Manual only. macOS and Windows runners bill at 10x and 2x clock time, so a tag
# push must never start this on its own. Releases are normally built on the
# maintainer's own machines and uploaded with "gh release" (see RELEASING.md).
# Run this by hand from the Actions tab when a clean-room build is wanted.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.5.0"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag }}

concurrency:
  group: desktop-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify the release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the release tag and changelog
        run: bun run release:check --tag "$RELEASE_TAG"

      - name: Sync the desktop version
        run: bun run desktop:sync-version

      - name: Run tests
        run: bun test

      - name: Run type checking
        run: bun run typecheck

      - name: Run lint
        run: bun run lint

  publish-desktop:
    name: Build and publish ${{ matrix.target }}
    needs: verify-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: darwin-arm64
          - platform: macos-latest
            target: darwin-x64
          # Windows is deferred from 0.5.0. Its Next build fails on the runner with a
          # webpack glob that reaches C:/Users/runneradmin. See inbox ticket W1.
          # - platform: windows-latest
          #   target: win32-x64
          # Linux is deferred from 0.5.0 with Windows. Both return in the next release.
          # - platform: ubuntu-latest
          #   target: linux-x64
    env:
      OMP_DESKTOP_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the Electron shell dependencies
        run: bun install --frozen-lockfile
        working-directory: desktop

      - name: Fetch the target Bun runtimes
        run: bun run desktop:fetch-bun

      - name: Sync the desktop version
        run: bun run desktop:sync-version

      - name: Require macOS signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "The ${name} secret is required." >&2
              exit 1
            fi
          done
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      # electron-builder 26.15.3 imports the certificate into a temporary keychain and
      # then runs `security set-key-partition-list` with the p12 password instead of the
      # keychain password, so every signed build fails with "passphrase is not correct".
      # The workflow owns the keychain instead and hands it over through CSC_KEYCHAIN.
      - name: Import the Developer ID certificate into a build keychain
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/reeve-signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CSC_LINK" | sed 's#^data:[^,]*,##' | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" > /dev/null
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate_path"
          security find-identity -v -p codesigning "$keychain_path"
          echo "CSC_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build the signed and notarized macOS packages
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # The staged server tree holds tens of thousands of files. The runner's default
        # open file limit (256) is too low for electron-builder's signing walk (EMFILE).
        run: |
          ulimit -n 65536
          bun run desktop:build

      - name: Verify the macOS signature and Gatekeeper assessment
        if: runner.os == 'macOS'
        run: |
          application_path=$(bun --silent run desktop:artifact-path)
          codesign --verify --deep --strict --verbose=2 "$application_path"
          spctl --assess --type execute --verbose=4 "$application_path"

      - name: Verify the packaged macOS application
        if: runner.os == 'macOS'
        run: bun run desktop:verify-package

      - name: Recheck the macOS signature after verification
        if: runner.os == 'macOS'
        run: |
          application_path=$(bun --silent run desktop:artifact-path)
          codesign --verify --deep --strict --verbose=2 "$application_path"

      # Windows ships unsigned at 0.5.0 (ADR-0006). Restore the WINDOWS_CSC_LINK and
      # WINDOWS_CSC_KEY_PASSWORD steps when a signing certificate exists.
      - name: Build the Windows package
        if: runner.os == 'Windows'
        run: bun run desktop:build

      - name: Verify the packaged Windows application
        if: runner.os == 'Windows'
        run: bun run desktop:verify-package

      - name: Build the Linux AppImage
        if: runner.os == 'Linux'
        run: bun run desktop:build

      - name: Verify the packaged Linux application
        if: runner.os == 'Linux'
        run: bun run desktop:verify-package

      - name: Upload the platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error

  publish-release:
    name: Publish the complete desktop release
    needs: publish-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Write the release notes from CHANGELOG.md
        run: bun scripts/release-notes.mjs "$RELEASE_TAG" > release-notes.md

      - name: Download every platform artifact
        uses: actions/download-artifact@v4
        with:
          path: desktop-artifacts
          merge-multiple: true

      - name: Publish the release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Reeve ${{ inputs.tag }}
          body_path: release-notes.md
          files: |
            desktop-artifacts/*.dmg
            desktop-artifacts/*.zip
            desktop-artifacts/*.exe
            desktop-artifacts/*.AppImage
            desktop-artifacts/*.blockmap
            desktop-artifacts/latest*.yml
          fail_on_unmatched_files: true
